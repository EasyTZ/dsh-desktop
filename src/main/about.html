<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>关于 DeepSeek Harness Desktop</title>
  <script>
    // 跟 updater.html 同一套：主题由主进程通过 query string 带过来，在 <style> 生效前
    // 同步写属性，不然会先画一帧焊死的深色再跳变。
    document.documentElement.dataset.theme =
      new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
  </script>
  <style>
    /* 色板、字体栈、header、按钮全部照抄 updater.html —— 两个从托盘点开的弹窗必须
       看起来是同一个程序的两个页面。改这里的 token 请同步改那边（或反过来）。 */
    :root {
      color-scheme: dark;
      --accent: #4d6bfe;
      --accent-soft: rgba(77, 107, 254, 0.14);
      --accent-soft-hover: rgba(77, 107, 254, 0.22);
      --bg: #151517;
      --text: #f9fafb;
      --text-dim: #cfd3d6;
      --card: #1b1b1c;
      --border: rgba(255, 255, 255, 0.06);
      --hover: rgba(255, 255, 255, 0.08);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #ffffff;
      --text: #0f1115;
      --text-dim: #61666b;
      --card: #f9fafb;
      --border: rgba(0, 0, 0, 0.04);
      --hover: rgba(38, 49, 72, 0.06);
      --accent: #3d5be0;
      --accent-soft: rgba(61, 91, 224, 0.10);
      --accent-soft-hover: rgba(61, 91, 224, 0.16);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      -webkit-user-select: none; user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { height: 100%; display: flex; flex-direction: column; padding: 20px 22px 16px; }

    header { display: flex; align-items: center; gap: 10px; flex: none; }
    .logo {
      width: 32px; height: 32px; padding: 5px; border-radius: 9px;
      background: var(--accent-soft); flex: none;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 100%; height: 100%; display: block; }
    .head-title { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
    .head-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
    .icon-close {
      margin-left: auto; flex: none; width: 26px; height: 26px; border-radius: 8px;
      border: none; background: transparent; color: var(--text-dim); font-size: 14px;
      font-family: inherit; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background .15s ease, color .15s ease;
    }
    .icon-close:hover { background: var(--hover); color: var(--text); }

    .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .view { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }

    /* 品牌行沿用闪屏的组合（鲸鱼 + deepseek + HARNESS 徽章），一句定位缀在下面。 */
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand svg { width: 26px; height: 26px; display: block; color: var(--text); }
    .wordmark { font-size: 20px; font-weight: 500; letter-spacing: -0.2px; line-height: 1; }
    .badge {
      font-size: 9.5px; font-weight: 600; letter-spacing: 1.3px;
      padding: 3px 6px 2px; border-radius: 5px;
      border: 1px solid var(--text-dim); opacity: .75;
      color: var(--text); line-height: 1; align-self: center; margin-top: 2px;
    }
    .tagline { font-size: 12px; color: var(--text-dim); margin-top: -6px; }

    /* 信息表：跟更新中心的 .ver-row 同一种卡片（同底色、同边框、同圆角）。 */
    .info {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
    }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 9px 14px; font-size: 13px;
    }
    .row + .row { border-top: 1px solid var(--border); }
    .row .k { color: var(--text-dim); flex: none; }
    .row .v {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .row .v.mono { -webkit-user-select: text; user-select: text; }
    .row .v.dim { color: var(--text-dim); }
    /* 链接样式对齐更新中心页脚的「下载源」：下划线 + hover 变强调色。 */
    .link {
      color: var(--text); cursor: pointer; text-decoration: underline;
      text-underline-offset: 2px; text-decoration-color: var(--text-dim);
      background: none; border: none; font: inherit; padding: 0;
    }
    .link:hover { color: var(--accent); text-decoration-color: var(--accent); }

    .actions { display: flex; gap: 10px; width: 100%; margin-top: 2px; }
    .btn {
      flex: 1 1 0; min-width: 0; height: 38px; padding: 0 10px; border-radius: 9px;
      border: 1px solid var(--border); background: transparent; color: var(--text);
      font-size: 13.5px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: background .15s ease, transform .05s ease;
      white-space: nowrap;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn:hover { background: var(--hover); }
    .btn:active { transform: scale(0.98); }
    .btn.primary { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .btn.primary:hover { background: var(--accent-soft-hover); }

    footer {
      flex: none; margin-top: 14px; padding-top: 11px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      font-size: 11px; color: var(--text-dim);
    }
    footer .link { color: var(--text-dim); }
  </style>
</head>

  <script>
    (function () {
      function text(id, value) { document.getElementById(id).textContent = value; }
      function bind(id, fn) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('click', fn);
      }
      function open(target) { return function () { window.about.open(target); }; }
      function close() { window.about.close(); }

      function render(info) {
        text('app-version', info.appVersion ? 'v' + info.appVersion : '—');
        var kernel = document.getElementById('kernel-version');
        if (info.kernelVersion) {
          kernel.textContent = 'dsh v' + info.kernelVersion;
          kernel.className = 'v mono';
        } else {
          // 开发态跑的是全局 dsh，不走打包内核目录，读不到版本号是正常的；打包态
          // 读不到说明内核目录不完整，那是个该被看见的问题，不用「—」糊过去。
          kernel.textContent = info.isPackaged ? '未知' : '开发态（全局 dsh）';
          kernel.className = 'v mono dim';
        }
        text('author', info.author || '—');
        text('repo', info.repoLabel || info.repoUrl || '—');
        document.getElementById('repo').title = info.repoUrl || '';
        if (info.license) text('license', info.license + ' License');
      }

      bind('btn-header-close', close);
      bind('btn-close', close);
      bind('btn-repo', open('repo'));
      bind('repo', open('repo'));
      bind('author', open('author'));
      bind('btn-issues', open('issues'));
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

      if (window.about) {
        window.about.getInfo().then(render).catch(function () {});
        if (window.about.onTheme) {
          window.about.onTheme(function (mode) {
            document.documentElement.dataset.theme = mode === 'light' ? 'light' : 'dark';
          });
        }
      }
    })();
  </script>
