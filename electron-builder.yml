appId: com.deepseek.desktop
productName: DeepSeek Harness Desktop
copyright: Copyright © 2026 EasyTZ
# 无生产依赖：依赖由外部处理，跳过 install/rebuild 与 node_modules 收集。
beforeBuild: scripts/before-build.js
# 打完包再裁掉用不到的 Electron 语言包（~45MB）。见该脚本注释。
afterPack: scripts/after-pack.js
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
extraResources:
  # 内核以单个 kernel.tar.gz 的形式打进包，首次启动时由主进程铺开。
  # 为什么不直接铺：资源管理器解 zip 的耗时由文件个数决定 —— 15444 个文件要 181 秒，
  # 打成一个文件后用户那一步几乎瞬间完成。详见 scripts/pack-kernel.mjs。
  - from: kernel-dist
    to: kernel
    filter:
      - "**/*"
  # 插件源码 + 清单：热更新新内核后，据此把自定义插件重装进新版内核。
  # 拆仓后源码分散在 plugins/（桌面专属）与 node_modules/（git 依赖）两处，
  # 由 scripts/pack-plugins.mjs 按 plugins.json 摊平到 plugins-dist/ 再进包。
  - from: plugins-dist
    to: plugins
    filter:
      - "**/*"
  - from: build/icon.png
    to: icon.png
asar: true
# 直接复用本机已安装的 Electron（node_modules/electron/dist），打包时不再下载
# Electron 二进制、也不再联网校验 SHASUMS256.txt，实现「一次安装、反复打包」。
electronDist: node_modules/electron/dist
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness Desktop
  artifactName: DeepSeek-Harness-Desktop-Setup-${version}.${ext}
