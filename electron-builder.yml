appId: com.deepseek.desktop
productName: DeepSeek Harness Desktop
copyright: Copyright © 2026 EasyTZ
# 无生产依赖：依赖由外部处理，跳过 install/rebuild 与 node_modules 收集。
beforeBuild: scripts/before-build.js
# 打完包再裁掉用不到的 Electron 语言包（~45MB）。见该脚本注释。
afterPack: scripts/after-pack.js
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
extraResources:
  # 内核以单个 kernel.tar.gz 的形式打进包，首次启动时由主进程铺开。**仅 Windows
  # 需要**：资源管理器解 zip 的耗时由文件个数决定 —— 15444 个文件要 181 秒，打成
  # 一个文件后用户那一步几乎瞬间完成，详见 scripts/pack-kernel.mjs。Linux 的
  # AppImage 是 squashfs 镜像，根本没有「逐文件解压」这一步，前提不成立——linux
  # 段下面整段覆盖成直接打包 kernel/ 目录，不经过 kernel-dist。
  - from: kernel-dist
    to: kernel
    filter:
      - "**/*"
  # profile 层插件的 tgz + 索引：首启（以及用户卸载后想装回来）时离线安装的来源。
  # 由 scripts/pack-profile-plugins.mjs 按 profile-plugins.json `npm pack` 而成。
  - from: plugins-dist
    to: plugins
    filter:
      - "**/*"
  - from: build/icon.png
    to: icon.png
asar: true
# 直接复用本机已安装的 Electron（node_modules/electron/dist），打包时不再下载
# Electron 二进制、也不再联网校验 SHASUMS256.txt，实现「一次安装、反复打包」。
electronDist: node_modules/electron/dist
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness Desktop
  artifactName: DeepSeek-Harness-Desktop-Setup-${version}.${ext}
dmg:
  # Finder 一挂载镜像就展示安装与 Gatekeeper 放行步骤；应用在被放行前无法自己弹窗。
  background: build/dmg-background.png
  window:
    width: 660
    height: 480
  iconSize: 92
  iconTextSize: 12
  contents:
    - x: 150
      y: 160
      type: file
    - x: 510
      y: 160
      type: link
      path: /Applications
linux:
  target:
    - target: AppImage
      arch: [x64]
  # freedesktop.org 分类，AppImage 的 .desktop 条目要用；这个应用是给开发者用的
  # 桌面壳，没有更贴切的官方分类，选 Development。
  category: Development
  # 单文件 ≥512 即可：electron-builder 会拿它自动切出 Linux 需要的整套图标尺寸，
  # 不需要像 mac 的 icns 那样自己准备目录。build/icon.png 现在是 1024，见
  # scripts/gen-icon.mjs。
  icon: build/icon.png
  artifactName: DeepSeek-Harness-Desktop-${version}.${ext}
  # 内核不打 tar，kernel/ 目录整棵原样交给 extraResources——squashfs 没有
  # 「逐文件解压」这一步，打 tar 只会多一层无意义的解压。（任务 7 的 macOS
  # 也会走这条：就地解包会破坏 .app 的代码签名。）
  #
  # 这段跟顶层 extraResources 是**合并**关系，不是覆盖（实测 VM 上打包时顶层
  # 那条 `from: kernel-dist` 也会被 electron-builder 尝试处理一次，只是此时源路径
  # 必然不存在——pack-kernel.mjs 在非 win 目标下已经删掉了 kernel-dist——所以
  # 只打印一条无害的 "file source doesn't exist" 警告，不影响构建）。
  extraResources:
    - from: kernel
      to: kernel
      filter:
        - "**/*"
    - from: plugins-dist
      to: plugins
      filter:
        - "**/*"
    - from: build/icon.png
      to: icon.png
mac:
  target:
    - target: dmg
      arch: [arm64]
  # Apple 官方 LSApplicationCategoryType，这个应用是给开发者用的桌面壳，选
  # developer-tools。只出 arm64：.app 里塞的是 arch 特定的 .node / rg / node，
  # universal 要么装两套内核树（单平台已经 300+ MB，翻倍不划算），要么对整棵树
  # lipo（不现实）。Intel Mac 暂不支持。
  category: public.app-category.developer-tools
  # electron-builder 拿单张 ≥512 的 PNG 自动生成 icns，跟 linux 段同理。
  icon: build/icon.png
  artifactName: DeepSeek-Harness-Desktop-${version}.${ext}
  # 内核不打 tar，理由比 Linux 更硬：unpackKernel() 就地解到 resources/kernel
  # 后会 rmSync 删归档——mac 上这等于往一个已签名的 .app 里写文件、删文件，
  # 签名当场失效，而 arm64 上签名失效不是弹窗提示，是根本起不来。所以跟 linux
  # 段一样直接把 kernel/ 目录整棵交给 extraResources，不经过 kernel-dist。
  # 这段跟顶层 extraResources 是合并关系（同一个实测结论，见 linux 段注释）。
  extraResources:
    - from: kernel
      to: kernel
      filter:
        - "**/*"
    - from: plugins-dist
      to: plugins
      filter:
        - "**/*"
    - from: build/icon.png
      to: icon.png
    # mac 菜单栏托盘图标：文件名以 Template 结尾，Electron/macOS 会自动按纯黑
    # + alpha 的模板图处理（自动适配浅色/深色菜单栏、选中态反色）。彩色图标
    # resize 到 16px 在深色菜单栏里是一坨糊的方块，所以单独渲染一份单色版，
    # 见 scripts/gen-icon.mjs。@2x 是 Retina 变体，跟 Template.png 放同目录，
    # Electron 会自动按屏幕缩放挑选。
    - from: build/iconTemplate.png
      to: iconTemplate.png
    - from: build/iconTemplate@2x.png
      to: iconTemplate@2x.png
