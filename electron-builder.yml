appId: com.deepseek.desktop
productName: DeepSeek Harness Desktop
copyright: Copyright © 2026 deepseek-desktop
# 无生产依赖：依赖由外部处理，跳过 install/rebuild 与 node_modules 收集。
beforeBuild: scripts/before-build.js
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
extraResources:
  - from: kernel
    to: kernel
    filter:
      - "**/*"
  # 插件源码 + 清单：热更新新内核后，据此把自定义插件重装进新版内核。
  - from: plugins
    to: plugins
    filter:
      - "**/*"
  - from: build/icon.png
    to: icon.png
asar: true
# 直接复用本机已安装的 Electron（node_modules/electron/dist），打包时不再下载
# Electron 二进制、也不再联网校验 SHASUMS256.txt，实现「一次安装、反复打包」。
electronDist: node_modules/electron/dist
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness Desktop
  artifactName: DeepSeek-Harness-Desktop-Setup-${version}.${ext}
