# 发版流水线：把本机手动 `npm run dist` 搬到 CI 上。
#
# 先只跑 Windows 那一版做出的判断在这里也成立：`npm run dist` 最有价值也最慢的
# 一步（verify-kernel）会真的启动一次内核，这件事只能在目标平台上做——所以加
# Linux / macOS 用的都是**独立 job**，不是一个 os 矩阵。矩阵适合「同一套 steps，
# 只是 runs-on 不同」的场景；这三个 job 用的 shell 不同（pwsh / bash）、
# electron-builder 目标（--win / --linux / --mac）、产物文件名、要不要处理
# nsis/dmg 也完全不同——摊开成矩阵反而要塞一堆 if 分支，不如三个 job 各自直给。
# 详见 docs/decisions/packaging.md「为什么上 CI」。
name: Release

on:
  push:
    tags:
      - 'v*'
  # 第一次调试不可能靠反复打 tag 来试，手动触发是必须的。从 UI 选择某个已有
  # tag 作为 ref 手动跑，可以完整测到下面的发布步骤；从默认分支手动跑则只验
  # 证打包本身，不会碰 Release（见 publish job 的 if 条件）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # 本机整条 dist 大约十分钟量级，CI 上装依赖 + 装内核会更久。给 60 分钟的
    # 上限：真卡住时（verify-kernel 的 90s 预算只覆盖「等地址行」那一段，
    # 别的步骤没有各自的超时）不至于白占 runner 到默认的 6 小时。
    timeout-minutes: 60
    outputs:
      kernel-version: ${{ steps.kernel.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 装依赖会顺带拉五个插件的 git 依赖（package.json 里钉的 tag），需要联网
      # 访问 github.com；不要配任何镜像，GitHub runner 直连比经代理快。
      - name: 安装依赖
        run: npm ci

      # dist.mjs 自己会跑完 校验插件 pin → prepare-kernel → 打插件 tgz →
      # 内核自检 → electron-builder → collect-release 整条链路，产物落在 release/。
      # 显式传 --win，不依赖「猜的默认值恰好是 win」——CI 上意图要写清楚。
      - name: 打包
        run: npm run dist -- --win

      # 产物文件名里只有应用版本号，内核是独立升级的另一条线，发布说明必须
      # 单独写清楚这次打进包的内核版本——collect-release.mjs 在控制台打印过
      # 一次，这里换成读同一份 package.json，作为后续 step / job 能用的输出。
      - name: 读取本次内置内核版本
        id: kernel
        shell: pwsh
        run: |
          $pkgPath = Join-Path $env:GITHUB_WORKSPACE 'kernel\runtime\node_modules\@deepseek-ai\dsh\package.json'
          $version = (Get-Content -Raw $pkgPath | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 三个平台各自的产物都先落到 Actions artifact，真正发布交给下面的 publish
      # job 统一做——原因见文件头注释：避免 Windows / Linux / macOS 三个 job
      # 各自调用一次 action-gh-release，同时对着同一个刚创建的 Release 抢着建，
      # 产生竞态。只保留 7 天：这不是给终端用户下载的渠道（那是 Release），
      # 调试完就没用了，每份 370MB+，没必要占着默认的 90 天。
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: release/*
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      kernel-version: ${{ steps.kernel.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # AppImage 是 squashfs 镜像，没有 Windows 那套「打 tar 省资源管理器解压时间」
      # 的理由（见 scripts/pack-kernel.mjs 头部注释），dist.mjs 传 --linux 之后会
      # 自己跳过打 tar，extraResources 直接吃 kernel/ 目录。
      - name: 打包
        run: npm run dist -- --linux

      - name: 读取本次内置内核版本
        id: kernel
        shell: bash
        run: |
          version=$(node -p "require('./kernel/runtime/node_modules/@deepseek-ai/dsh/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v5
        with:
          name: release-linux
          path: release/*
          retention-days: 7

  build-mac:
    # macos-14 是 Apple Silicon（arm64）runner，跟 electron-builder.yml 里
    # `mac.target.arch: [arm64]` 对上——不需要交叉编译，也交叉不了（dmg 打包
    # 跟 verify-kernel 一样只能在目标平台真跑）。
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      kernel-version: ${{ steps.kernel.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # dmg 是挂载镜像，跟 AppImage 的 squashfs 一样没有「逐文件解压」这一步，
      # dist.mjs 传 --mac 之后跟 --linux 一样跳过打 tar。不打签名 identity——
      # 已定不买 Developer ID，让 electron-builder 走它自己的 ad-hoc 默认行为，
      # 这条本身没有在 CI 上验证过（CI 不能验证「用户双击能不能打开」，那是
      # 真机验证清单的活，见 docs/decisions/multiplatform.md）。
      - name: 打包
        run: npm run dist -- --mac

      - name: 读取本次内置内核版本
        id: kernel
        shell: bash
        run: |
          version=$(node -p "require('./kernel/runtime/node_modules/@deepseek-ai/dsh/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 挂载刚打出来的 dmg，把「这轮 CI 上能查到的」全查一遍。
      #
      # 为什么值得单开一步：macos runner **本身就是一台真的 Apple Silicon Mac**，
      # codesign / hdiutil 都能跑。把签名状态和包内结构在这里查掉，借来的 Mac 上
      # 就只剩「Gatekeeper 的真实观感」和「Hardened Runtime 要不要开」这两条真正
      # 非人不可的事，不用浪费借机时间去发现本来就能自动发现的问题。
      - name: 校验 dmg 内容与签名
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(ls release/*.dmg)
          echo "::group::挂载 $DMG"
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          APP="$MNT/$(ls "$MNT" | grep '\.app$' | head -1)"
          echo "app = $APP"
          echo "::endgroup::"

          echo "::group::包内结构"
          RES="$APP/Contents/Resources"
          # 内核必须是**目录树**而不是 kernel.tar —— 就地解包会破坏 .app 签名，
          # 而 arm64 上签名失效等于起不来（见 docs/decisions/multiplatform.md）。
          test -d "$RES/kernel/runtime/node_modules/@deepseek-ai/dsh" \
            || { echo "内核不是展开的目录树"; exit 1; }
          test ! -f "$RES/kernel/kernel.tar" || { echo "不该有 kernel.tar"; exit 1; }
          test -x "$RES/kernel/node" || { echo "内核 node 缺失或不可执行"; exit 1; }
          echo "内核 node: $(file -b "$RES/kernel/node" | head -c 80)"
          TGZ=$(ls "$RES/plugins/profile"/*.tgz | wc -l | tr -d ' ')
          echo "随包插件 tgz: $TGZ 个"
          test "$TGZ" = "5" || { echo "插件数量不对，应为 5"; exit 1; }
          test -f "$RES/iconTemplate.png" || { echo "缺 mac 托盘 template 图"; exit 1; }
          echo "::endgroup::"

          echo "::group::签名状态"
          # 这两条回答的是「真机验证清单」的第 1、2 项。--verify 不过就直接失败：
          # 签不上的包在 Apple Silicon 上根本起不来，发出去比构建失败糟糕得多。
          codesign -dv --verbose=4 "$APP" 2>&1 | head -20
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- 内核里的原生件是否也签上了 ---"
          codesign -dv "$RES/kernel/node" 2>&1 | grep -E "Signature|Identifier" || true
          echo "::endgroup::"

          hdiutil detach "$MNT" -quiet
          echo "dmg 校验通过"

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v5
        with:
          name: release-mac
          path: release/*
          retention-days: 7

  # 只在真正由 tag 触发（push tag，或 workflow_dispatch 手动选了某个 tag）时才
  # 发布：手动从分支跑只是想验证打包本身能不能过，不该产生一个 Release。
  #
  # 三个平台的产物在这里汇合成同一次 action-gh-release 调用——这是「合并到同一个
  # Release」问题的答案：不是让三个 build job 各发各的，而是都发去 job artifact，
  # 由这个下游 job 一次性收集、一次性发布，天然不会有谁先谁后创建 Release 的竞态。
  publish:
    needs: [build-windows, build-linux, build-mac]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v5
        with:
          name: release-windows
          path: release

      - name: 下载 Linux 产物
        uses: actions/download-artifact@v5
        with:
          name: release-linux
          path: release

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v5
        with:
          name: release-mac
          path: release

      # 三个 job 装的是同一份 kernel-src/ 声明，理论上版本必然相同；万一将来
      # 谁改漏了导致不一致，这里直接报错，好过发布说明里悄悄写错一个版本号。
      - name: 核对三个平台的内核版本一致
        run: |
          win="${{ needs.build-windows.outputs.kernel-version }}"
          linux="${{ needs.build-linux.outputs.kernel-version }}"
          mac="${{ needs.build-mac.outputs.kernel-version }}"
          echo "windows=$win linux=$linux mac=$mac"
          if [ "$win" != "$linux" ] || [ "$win" != "$mac" ]; then
            echo "三个平台打进包的内核版本不一致：windows=$win linux=$linux mac=$mac" >&2
            exit 1
          fi

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            本次内置内核：dsh ${{ needs.build-windows.outputs.kernel-version }}

            完整更新日志见 [CHANGELOG.md](https://github.com/EasyTZ/dsh-desktop/blob/main/CHANGELOG.md)。
