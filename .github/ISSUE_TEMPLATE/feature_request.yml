name: 功能建议
description: 想要的新功能，或者对现有体验的改进意见
labels: ["enhancement"]
body:
  - type: textarea
    id: proposal
    attributes:
      label: 你想要什么
      description: 描述你期望的功能或改进
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 使用场景
      description: 什么情况下你会用到它，能解决什么问题
    validations:
      required: false
